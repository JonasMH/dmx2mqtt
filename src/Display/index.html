<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>DMX</title>
<style>
	:root {
		--bg: #0b0b10;
		--panel: #16161f;
		--panel-2: #20202c;
		--text: #ececf3;
		--muted: #8a8aa0;
		--accent: #ff7a1a;
		--ok: #3ddc84;
		--bad: #ff4d5e;
		--radius: 14px;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: var(--bg); color: var(--text); }
	body {
		font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		padding: max(16px, env(safe-area-inset-top)) 16px 24px;
		max-width: 1100px;
		margin: 0 auto;
		-webkit-tap-highlight-color: transparent;
		user-select: none;
	}
	button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

	header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
	h1 { font-size: 1.3rem; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }
	.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
	.status.ok .dot { background: var(--ok); }
	.status.bad { color: var(--bad); }
	.status.bad .dot { background: var(--bad); }
	.power {
		width: 64px; height: 44px; border-radius: 22px; border: 0;
		background: var(--panel-2); font-weight: 600;
	}
	.power.on { background: var(--accent); color: #000; }

	section { background: var(--panel); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
	h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

	.stage { display: flex; flex-wrap: wrap; gap: 20px 28px; justify-content: center; padding: 8px 0; }
	.fixture { flex: 1 1 300px; max-width: 520px; }
	.bar {
		display: flex; gap: 4px; padding: 6px; border-radius: 10px;
		background: #050507; border: 1px solid #2a2a36;
	}
	.segment {
		flex: 1; aspect-ratio: 1 / 1.4; border-radius: 4px; background: #000;
		transition: box-shadow .05s linear;
	}
	.fixture-name { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 6px; }

	.brightness { display: flex; align-items: center; gap: 14px; }
	.brightness output { width: 3.5em; text-align: right; font-variant-numeric: tabular-nums; }
	input[type=range] { flex: 1; height: 44px; accent-color: var(--accent); }

	.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; }
	.swatch, .custom {
		aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; padding: 0;
		box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
	}
	.swatch.active, .custom.active { border-color: var(--text); }
	.custom { display: block; position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
	.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }

	.effects { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
	.effect {
		min-height: 56px; border-radius: 12px; border: 0; background: var(--panel-2);
		font-weight: 600; padding: 8px;
	}
	.effect.active { background: var(--accent); color: #000; }

	.tempo { display: flex; align-items: center; gap: 16px; }
	.tap {
		flex: 1; min-height: 88px; border-radius: 16px; border: 0;
		background: var(--panel-2); font-size: 1.4rem; font-weight: 700; letter-spacing: .1em;
	}
	.tap:active { background: var(--accent); color: #000; }
	.bpm { text-align: center; min-width: 5.5em; }
	.bpm b { display: block; font-size: 2.2rem; font-variant-numeric: tabular-nums; line-height: 1.1; }
	.bpm span { color: var(--muted); font-size: .85rem; }
	.hint { color: var(--muted); font-size: .85rem; margin: 10px 0 0; }

	.mic { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
	.mic[hidden] { display: none; }
	.mic-button {
		min-width: 9.5em; min-height: 56px; border-radius: 12px; border: 0;
		background: var(--panel-2); font-weight: 600; padding: 8px 14px;
	}
	.mic-button.on { background: var(--accent); color: #000; }
	.meter { flex: 1; height: 12px; border-radius: 6px; background: #050507; overflow: hidden; }
	.meter div { height: 100%; width: 0; background: var(--ok); transition: width .05s linear; }
	.mic-status { color: var(--muted); font-size: .85rem; min-width: 7em; text-align: right; }
	.mic-status.locked { color: var(--ok); }
</style>
</head>
<body>
<header>
	<h1 id="name">DMX</h1>
	<div class="status" id="status"><span class="dot"></span><span id="status-text">Connecting</span></div>
	<button class="power" id="power" aria-pressed="false">Off</button>
</header>

<section>
	<div class="stage" id="stage"></div>
</section>

<section>
	<h2>Brightness</h2>
	<div class="brightness">
		<input type="range" id="brightness" min="1" max="255" value="255" aria-label="Brightness">
		<output id="brightness-value">100%</output>
	</div>
</section>

<section>
	<h2>Colour</h2>
	<div class="swatches" id="swatches"></div>
</section>

<section>
	<h2>Effect</h2>
	<div class="effects" id="effects"></div>
</section>

<section>
	<h2>Tempo</h2>
	<div class="tempo">
		<button class="tap" id="tap">TAP</button>
		<div class="bpm"><b id="bpm">120</b><span>BPM</span></div>
	</div>
	<div class="mic" id="mic" hidden>
		<button class="mic-button" id="mic-button" aria-pressed="false">Sync</button>
		<div class="meter" aria-hidden="true"><div id="meter"></div></div>
		<span class="mic-status" id="mic-status"></span>
	</div>
	<p class="hint" id="tempo-hint">Tap along to set the tempo for the Beat and Party effects. A single tap moves the beat to now.</p>
</section>

<script>
	const colors = [
		[255, 0, 0], [255, 60, 0], [255, 140, 60], [255, 200, 0], [40, 255, 20], [0, 255, 200],
		[0, 60, 255], [140, 0, 255], [255, 0, 140], [255, 255, 255],
	];

	const $ = id => document.getElementById(id);
	let light = {};
	let segments = []; // [element, pixel index]
	let dragging = false;

	async function post(url, body) {
		try {
			await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
		} catch {
			// The event stream shows that we are offline
		}
	}

	// At most one request per interval while a slider or picker is dragged, always ending on the last value
	function throttle(fn, ms) {
		let timer = null, pending = null;
		return value => {
			pending = value;
			if (timer) return;
			fn(pending);
			pending = null;
			timer = setTimeout(function flush() {
				if (pending === null) { timer = null; return; }
				fn(pending);
				pending = null;
				timer = setTimeout(flush, ms);
			}, ms);
		};
	}

	const sameColor = (a, b) => a && b && a.r === b[0] && a.g === b[1] && a.b === b[2];
	const toHex = c => "#" + [c.r, c.g, c.b].map(x => x.toString(16).padStart(2, "0")).join("");

	// Layout: one bar per fixture, segments in the order they hang
	async function loadLayout() {
		const layout = await (await fetch("/api/layout")).json();
		document.title = layout.name;
		$("name").textContent = layout.name;

		const stage = $("stage");
		stage.replaceChildren();
		segments = [];
		for (const fixture of layout.fixtures) {
			const wrap = document.createElement("div");
			wrap.className = "fixture";
			const bar = document.createElement("div");
			bar.className = "bar";
			for (const pixel of fixture.pixels) {
				const segment = document.createElement("div");
				segment.className = "segment";
				bar.append(segment);
				segments.push([segment, pixel]);
			}
			const name = document.createElement("div");
			name.className = "fixture-name";
			name.textContent = fixture.name;
			wrap.append(bar, name);
			stage.append(wrap);
		}

		const effects = $("effects");
		effects.replaceChildren();
		for (const effect of layout.effects) {
			const button = document.createElement("button");
			button.className = "effect";
			button.textContent = effect;
			button.dataset.effect = effect;
			button.onclick = () => post("/api/light", { state: "ON", effect });
			effects.append(button);
		}
	}

	function buildSwatches() {
		const swatches = $("swatches");
		for (const c of colors) {
			const button = document.createElement("button");
			button.className = "swatch";
			button.style.background = `rgb(${c})`;
			button.setAttribute("aria-label", `rgb(${c})`);
			button.dataset.color = c.join(",");
			button.onclick = () => post("/api/light", { state: "ON", color: { r: c[0], g: c[1], b: c[2] } });
			swatches.append(button);
		}
		const custom = document.createElement("label");
		custom.className = "custom";
		custom.title = "Other colour";
		const input = document.createElement("input");
		input.type = "color";
		input.id = "custom-color";
		const sendColor = throttle(hex => post("/api/light", {
			state: "ON",
			color: { r: parseInt(hex.slice(1, 3), 16), g: parseInt(hex.slice(3, 5), 16), b: parseInt(hex.slice(5, 7), 16) },
		}), 100);
		input.oninput = () => sendColor(input.value);
		custom.append(input);
		swatches.append(custom);
	}

	function showState(state) {
		light = state.light;
		const on = light.state === "ON";
		$("power").classList.toggle("on", on);
		$("power").textContent = on ? "On" : "Off";
		$("power").setAttribute("aria-pressed", on);

		if (!dragging) {
			$("brightness").value = light.brightness;
		}
		$("brightness-value").textContent = Math.round(light.brightness / 2.55) + "%";

		let preset = false;
		for (const swatch of document.querySelectorAll(".swatch")) {
			const active = sameColor(light.color, swatch.dataset.color.split(",").map(Number));
			swatch.classList.toggle("active", active);
			preset ||= active;
		}
		document.querySelector(".custom")?.classList.toggle("active", !preset);
		if (!preset && light.color) $("custom-color").value = toHex(light.color);

		for (const button of document.querySelectorAll(".effect")) {
			button.classList.toggle("active", button.dataset.effect === light.effect);
		}

		$("bpm").textContent = Math.round(state.bpm);
		showAudio(state.audio);
		setStatus(state.output_connected ? "ok" : "bad", state.output_connected ? "Live" : "DMX offline");
	}

	let audio = null;

	function showAudio(state) {
		audio = state;
		$("mic").hidden = !state;
		if (!state) return;
		const following = state.following && state.device;
		$("mic-button").classList.toggle("on", state.following);
		$("mic-button").setAttribute("aria-pressed", state.following);
		$("mic-button").textContent = state.following ? "Sync: on" : "Sync: off";
		const status = $("mic-status");
		status.classList.toggle("locked", following && state.locked);
		status.textContent = !state.device ? "No audio"
			: !state.following ? "Tap tempo"
			: state.locked ? "On the beat" : "Listening";
		$("tempo-hint").textContent = state.following
			? `The tempo follows the music (${state.device ?? "no audio device"}). Tap to set it by hand instead.`
			: "Tap along to set the tempo for the Beat and Party effects. Sync follows the music again.";
	}

	function showPixels(hex) {
		for (const [segment, pixel] of segments) {
			const i = pixel * 6;
			const r = parseInt(hex.slice(i, i + 2), 16) || 0;
			const g = parseInt(hex.slice(i + 2, i + 4), 16) || 0;
			const b = parseInt(hex.slice(i + 4, i + 6), 16) || 0;
			const glow = Math.max(r, g, b) / 255;
			segment.style.background = `rgb(${r},${g},${b})`;
			segment.style.boxShadow = glow > 0.02 ? `0 0 ${4 + glow * 18}px ${glow * 6}px rgba(${r},${g},${b},${0.35 + glow * 0.4})` : "none";
		}
	}

	function setStatus(kind, text) {
		$("status").className = "status " + kind;
		$("status-text").textContent = text;
	}

	function connect() {
		const events = new EventSource("/api/events");
		events.addEventListener("state", e => showState(JSON.parse(e.data)));
		events.addEventListener("pixels", e => showPixels(e.data));
		events.addEventListener("level", e => $("meter").style.width = Math.round(Number(e.data) * 100) + "%");
		events.onerror = () => setStatus("bad", "Reconnecting");
	}

	$("power").onclick = () => post("/api/light", { state: light.state === "ON" ? "OFF" : "ON" });

	const brightness = $("brightness");
	const sendBrightness = throttle(value => post("/api/light", { state: "ON", brightness: value }), 100);
	brightness.oninput = () => {
		$("brightness-value").textContent = Math.round(brightness.value / 2.55) + "%";
		sendBrightness(Number(brightness.value));
	};
	brightness.onpointerdown = () => dragging = true;
	addEventListener("pointerup", () => dragging = false);

	// Tap tempo, timed here rather than on the server so network jitter doesn't skew it
	let taps = [];
	$("tap").onpointerdown = e => {
		e.preventDefault();
		const now = performance.now();
		if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
		taps.push(now);
		if (taps.length > 8) taps.shift();
		const bpm = taps.length > 1
			? 60000 * (taps.length - 1) / (now - taps[0])
			: Number($("bpm").textContent);
		post("/api/tempo", { bpm, since_beat_ms: performance.now() - now });
	};

	$("mic-button").onclick = () => post("/api/audio", { following: !audio?.following });

	// Keep a wall-mounted screen awake where the browser allows it (HTTPS or localhost)
	async function keepAwake() {
		try { await navigator.wakeLock?.request("screen"); } catch { }
	}
	document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && keepAwake());

	buildSwatches();
	loadLayout().then(connect).catch(() => { setStatus("bad", "Offline"); setTimeout(() => location.reload(), 5000); });
	keepAwake();
</script>
</body>
</html>
